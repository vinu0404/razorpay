[project]
name = "zoho-inventory-connector"
version = "0.1.0"
description = "Read-only Zoho Inventory MCP connector for Razorpay Agent Studio agents"
authors = [
    { name = "vinu0404", email = "22cd3034@rgipt.acin" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[project.scripts]
zoho-connector = "zoho_inventory_connector.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
